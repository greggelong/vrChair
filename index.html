<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Beijing Chair Street</title>

    <!--
  =====================================================================
  BEIJING CHAIR STREET  -  an A-Frame (WebVR / WebXR) walkable world
  =====================================================================
  A hazy autumn street in Beijing with the "street chair" (a wrecked
  bent-wood armchair with a taped 禁止停车 sign) scattered everywhere:
  some alone, some heaped in piles, some stacked, some in circles.

  HOW THE FILE IS ORGANISED
  -------------------------
  1. <style>         the small HUD (title, hint, buttons, touch pad)
  2. aframe.min.js   the A-Frame library (loaded from the A-Frame CDN)
  3. CHAIR_ASSET     the 3D chair, embedded as BASE64 (nothing is loaded
                     from disk). Geometry = base64 Float32/Uint32 arrays,
                     textures = base64 JPEG data-URIs.
  4. main script     CONFIG + five A-Frame components:
        chair-field    draws every chair with GPU instancing (one draw
                       call per chair part) and lays them out
        beijing-street builds the road, pavements, brick buildings,
                       trees, lamps, lantern strings, road signs, sky
        street-lights  sun + sky light (+ shadows on desktop)
        walker         walking: WASD / arrows, touch pad, VR thumbsticks
        (HUD code)     buttons: reshuffle chairs, back to start
  5. <a-scene>       the scene description that wires it all together

  CONTROLS
  --------
  Desktop : WASD or arrow keys to walk, Shift to run, drag the mouse to
            look, R to reshuffle the chairs.
  Phone   : drag to look (or move the phone), on-screen arrows to walk.
  VR      : press the VR goggles button (bottom right). Left thumbstick
            walks, right thumbstick snap-turns.

  CUSTOMISING
  -----------
  * Change CONFIG below (how many singles / piles / stacks / circles,
    where the circles and piles sit, street size).
  * Add  ?seed=123  to the URL to get a different (repeatable) shuffle.
  * To use a different chair, replace window.CHAIR_ASSET. Its format is
    described at the top of the "chair-field" component.

  NOTE ON HOSTING: WebXR needs https (GitHub Pages is fine). Normal
  desktop / phone viewing works on any host.
  =====================================================================
-->

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #26231e;
        }

        #hud {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #f4f1ea;
            text-shadow: 0 1px 5px rgba(0, 0, 0, .75);
        }

        #hud #title {
            position: absolute;
            left: 12px;
            top: calc(10px + env(safe-area-inset-top, 0px));
        }

        #hud #title b {
            display: block;
            font-size: 18px;
            letter-spacing: .06em;
        }

        #hud #title span {
            font-size: 12.5px;
            opacity: .9;
        }

        #hud #hint {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: calc(60px + env(safe-area-inset-bottom, 0px));
            font-size: 12.5px;
            opacity: .9;
            max-width: 520px;
        }

        #hud button {
            pointer-events: auto;
            font: inherit;
            color: #f4f1ea;
            background: rgba(20, 18, 14, .62);
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 8px;
            padding: 9px 12px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #hud button:focus-visible {
            outline: 3px solid #6ea8ff;
            outline-offset: 2px;
        }

        #bar {
            position: absolute;
            left: 12px;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            display: flex;
            gap: 8px;
        }

        #pad {
            position: absolute;
            right: 12px;
            bottom: calc(70px + env(safe-area-inset-bottom, 0px));
            display: none;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(2, 52px);
            gap: 6px;
        }

        #pad button {
            padding: 0;
            font-size: 18px;
            touch-action: none;
        }

        #pad .u {
            grid-column: 2;
            grid-row: 1;
        }

        #pad .l {
            grid-column: 1;
            grid-row: 2;
        }

        #pad .d {
            grid-column: 2;
            grid-row: 2;
        }

        #pad .r {
            grid-column: 3;
            grid-row: 2;
        }
    </style>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!--
  =====================================================================
  THE CHAIR ASSET
  ---------------------------------------------------------------------
  window.CHAIR_ASSET is exactly the structure the "chair-field" component
  decodes:

    {
      w, h, d    : bounding box size (x, y, z), metres
      mats[]     : { rough, metal, double, alpha,
                     tex:'data:image/jpeg;base64,...' | color:[r,g,b],
                     wrap:'mirror' }
      parts[]    : { n:'name', m:materialIndex,
                     P : base64 Float32 positions  (xyz ...)
                     N : base64 Float32 normals    (xyz ...)
                     UV: base64 Float32 tex coords (uv ...)
                     I : base64 Uint32 triangle indices }
    }

  The placeholder in the supplied file was never filled in, so the chair
  is modelled here in code and packed into that exact base64 format:
  a wrecked bent-wood armchair (legs, stretchers, seat, apron, back
  posts, back panel, top rail, armrests) with a 禁止停车 sign taped to
  the back of it. Units are metres, the model is centred on its own
  bounding box and its front is +z.
  =====================================================================
-->

    <script>
        (function () {
            'use strict';
            const THREE = AFRAME.THREE;

            /* ======================================================================
             * CONFIG  -  the easy knobs
             * ====================================================================== */
            const CONFIG = {
                seed: 7,                    // default shuffle; override with ?seed=NN in the URL

                // Street geometry (metres). The street runs along the z axis; you start at
                // the +z end and look down it towards -z.
                street: { length: 140, roadWidth: 8, sidewalkWidth: 3.2, curbHeight: 0.12 },

                // Where you start / the area you may walk in.
                start: { x: 0, z: 36 },
                walkBounds: { minX: -6.8, maxX: 6.8, minZ: -56, maxZ: 56 },

                chairs: {
                    singles: 18,              // chairs lying about on their own (some tipped over)
                    piles: 5,                 // untidy heaps of 7-11 chairs
                    stacks: 2,                // chairs stacked vertically like a (very wrong) tower
                    circles: 3,               // chairs arranged in a ring, all facing the middle

                    // Fixed "slots" the clusters are placed in. x = across the street
                    // (|x| < 4 is road, |x| > 4.05 is pavement), z = along the street.
                    // r = ring radius, n = chairs in the ring. Each slot is jittered a bit by the seed.
                    circleSlots: [
                        { x: -0.6, z: 16, r: 1.7, n: 7 },   // in the road, just ahead of you
                        { x: 5.6, z: -10, r: 1.15, n: 6 },   // on the right pavement
                        { x: 0.4, z: -32, r: 2.1, n: 9 }    // big council further down the road
                    ],
                    pileSlots: [
                        { x: 5.6, z: 6 },
                        { x: -5.4, z: -2 },
                        { x: -5.6, z: -20 },
                        { x: 1.8, z: -21 },
                        { x: 5.5, z: -42 }

                    stackSlots: [
                        { x: -5.4, z: 22 },
                        { x: 5.5, z: -27 }
                    ]

            const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];  // random element
            function mulberry32(a) {                                          // tiny seeded random generator
                return function () {
                    a |= 0; a = (a + 0x6D2B79F5) | 0;
                    let t = Math.imul(a ^ (a >>> 15), 1 | a);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }
            const urlSeed = parseInt(new URLSearchParams(location.search).get('seed'), 10);
            const START_SEED = Number.isFinite(urlSeed) ? urlSeed : CONFIG.seed;

            /* LAYOUT-BEGIN ========================================================
             * CHAIR LAYOUT  -  pure maths, no THREE. Returns a list of chairs:
             *   { x, y, z,  rx, ry, rz,  s,  tint }
             * position (y = centre of the chair), rotation (Euler 'YXZ': yaw ry is
             * applied last, so ry spins the chair on the spot, rx/rz tip it over),
             * uniform scale s and a brightness tint so no two chairs look identical.
             * ===================================================================== */
            const CURB_X = CONFIG.street.roadWidth / 2 + 0.05;   // |x| beyond this is pavement
            const groundY = (x) => (Math.abs(x) > CURB_X ? CONFIG.street.curbHeight : 0);

            // Half the vertical size of the chair's box after tipping it (rx, rz) and scaling it (s).
            // That is how far the centre must be lifted so the chair rests ON the ground, not in it.
            function halfY(rx, rz, s, D) {
                const cx = Math.cos(rx);
                return s * (Math.abs(cx * Math.sin(rz)) * D.w / 2 + Math.abs(cx * Math.cos(rz)) * D.h / 2 + Math.abs(Math.sin(rx)) * D.d / 2);
            }
            function put(out, rnd, D, x, z, rx, ry, rz, s, lift) {
                out.push({
                    x, z, rx, ry, rz, s, tint: rr(rnd, 0.72, 1.0),
                    y: groundY(x) + halfY(rx, rz, s, D) * 0.94 + (lift || 0)
                });
            }

            function buildLayout(seed, D, cfg) {
                const rnd = mulberry32(seed * 9973 + 17);
                const out = [];
                const zones = [];   // {x,z,r}: keeps lone chairs from landing on top of the clusters

                // ---- circles: every chair faces the centre; one may have fallen over ----
                cfg.circleSlots.slice(0, cfg.circles).forEach((sl) => {
                    const cx = sl.x + rr(rnd, -0.4, 0.4), cz = sl.z + rr(rnd, -2, 2);

                        }
                    });
                    zones.push({ x: cx, z: cz, r: 2.2 });
                });

                cfg.stackSlots.slice(0, cfg.stacks).forEach((sl) => {

                    const base = rnd() * TAU;
                    for (let k = 0; k < n; k++) {
                        put(out, rnd, D, cx + rr(rnd, -0.07, 0.07), cz + rr(rnd, -0.07, 0.07),
                            rr(rnd, -0.05, 0.05), base + rr(rnd, -0.5, 0.5), rr(rnd, -0.05, 0.05), 1, k * 0.46);

                let tries = 0;
                while (lone.length < cfg.singles && tries++ < 600) {
                    const onRoad = rnd() < 0.35;
                    const x = onRoad ? rr(rnd, -3.4, 3.4) : (rnd() < 0.5 ? -1 : 1) * rr(rnd, 4.7, 6.7);
                    const z = rr(rnd, -54, 30);
                    if (zones.some((q) => Math.hypot(q.x - x, q.z - z) < q.r)) continue;
                    if (lone.some((q) => Math.hypot(q.x - x, q.z - z) < 1.6)) continue;
                    lone.push({ x, z });
                    const k = rnd();
                    let rx = 0, rz = rr(rnd, -0.05, 0.05);
                    if (k > 0.82) rz = (rnd() < 0.5 ? 1 : -1) * 1.5;               // fallen on its side
                    else if (k > 0.72) rx = (rnd() < 0.5 ? 1 : -1) * 1.25;          // tipped onto its back / face
                    put(out, rnd, D, x, z, rx, rnd() * TAU, rz, rr(rnd, 0.92, 1.08), 0);
                }
                return out;
            }
            /* LAYOUT-END ========================================================== */

            /* ======================================================================
             * Small helpers for colour management (works with old and new three.js)
             * ====================================================================== */
            function srgbTexture(t) {
                if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding;
                return t;
            }
            function srgbColor(r, g, b) {
                const c = new THREE.Color();

                return c;
            }
            // Draw something onto a canvas and turn it into a repeating texture.
            function canvasTexture(w, h, draw, repX, repY) {
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                draw(c.getContext('2d'), w, h);
                const t = new THREE.CanvasTexture(c);
                t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX || 1, repY || 1); t.anisotropy = 4;
                return srgbTexture(t);
            }
            const std = (o) => new THREE.MeshStandardMaterial(o);

            /* ======================================================================
             * COMPONENT  chair-field
             * Builds the chair from window.CHAIR_ASSET and draws ALL chairs with
             * THREE.InstancedMesh: one instanced mesh per chair part, so ~100 chairs
             * cost the same as one chair. scatter(seed) recomputes the layout.
             * ====================================================================== */
            AFRAME.registerComponent('chair-field', {
                schema: { max: { type: 'int', default: 220 } },     // capacity (max chairs)

                init: function () {
                    const A = window.CHAIR_ASSET;
                    if (!A || !A.parts) {
                        console.error('chair-field: window.CHAIR_ASSET is missing or empty.');
                        return;
                    }
                    this.dims = { w: A.w, h: A.h, d: A.d };
                    const dec = (b, T) => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new T(u.buffer); };
                    const renderer = this.el.sceneEl.renderer;
                    const aniso = renderer ? renderer.capabilities.getMaxAnisotropy() : 4;

                    // materials (embedded JPEG textures are decoded by the browser, no network)
                    this.mats = A.mats.map((d) => {
                        const o = { roughness: d.rough, metalness: (d.metal || 0) * 0.5, side: d.double ? THREE.DoubleSide : THREE.FrontSide };
                        if (d.alpha < 1) { o.transparent = true; o.opacity = d.alpha; o.depthWrite = false; }
                        if (d.tex) {
                            const t = srgbTexture(new THREE.TextureLoader().load(d.tex));
                            t.anisotropy = aniso;
                            t.wrapS = t.wrapT = d.wrap === 'mirror' ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping;
                            o.map = t;
                        } else o.color = srgbColor(d.color[0], d.color[1], d.color[2]);
                        return new THREE.MeshStandardMaterial(o);
                    });

                    // one InstancedMesh per part
                    this.group = new THREE.Group();
                    this.meshes = A.parts.map((p) => {
                        const g = new THREE.BufferGeometry();
                        g.setAttribute('position', new THREE.BufferAttribute(dec(p.P, Float32Array), 3));
                        g.setAttribute('normal', new THREE.BufferAttribute(dec(p.N, Float32Array), 3));
                        g.setAttribute('uv', new THREE.BufferAttribute(dec(p.UV, Float32Array), 2));
                        g.setIndex(new THREE.BufferAttribute(new Uint16Array(dec(p.I, Uint32Array)), 1));
                        const mat = this.mats[p.m];
                        const im = new THREE.InstancedMesh(g, mat, this.data.max);
                        im.frustumCulled = false;                 // instances are spread over 100 m; skip the single bounding box test
                        im.castShadow = !mat.transparent;         // the see-through tape casts no shadow
                        im.receiveShadow = true;
                        if (mat.transparent) im.renderOrder = 2;  // draw tape after the solid things
                        this.group.add(im);
                        return im;
                    });
                    this.el.setObject3D('chairs', this.group);
                    this.scatter(START_SEED);
                },

                // Lay the chairs out again with a new seed and upload the instance matrices.
                scatter: function (seed) {
                    const list = buildLayout(seed, this.dims, CONFIG.chairs).slice(0, this.data.max);
                    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(0, 0, 0, 'YXZ');
                    const p = new THREE.Vector3(), s = new THREE.Vector3(), c = new THREE.Color();
                    this.meshes.forEach((im) => {
                        list.forEach((ch, i) => {
                            p.set(ch.x, ch.y, ch.z); e.set(ch.rx, ch.ry, ch.rz, 'YXZ'); q.setFromEuler(e); s.set(ch.s, ch.s, ch.s);
                            im.setMatrixAt(i, m.compose(p, q, s));
                            im.setColorAt(i, c.setRGB(ch.tint, ch.tint * rr(Math.random, 0.97, 1.0), ch.tint * 0.95));   // per-chair brightness
                        });
                        im.count = list.length;
                        im.instanceMatrix.needsUpdate = true;
                        if (im.instanceColor) im.instanceColor.needsUpdate = true;
                    });
                    this.count = list.length; this.seed = seed;
                    this.el.emit('chairs-scattered', { count: list.length, seed: seed });
                }
            });

            /* ======================================================================
             * COMPONENT  beijing-street
             * The whole environment, built from simple THREE meshes with textures
             * drawn on <canvas> (brick, asphalt, tiles, shop signs...). No image files.
             *   x = across the street (road |x|<4, pavements to |x|=7.2, buildings beyond)
             *   z = along the street,  y = up
             * ====================================================================== */
            AFRAME.registerComponent('beijing-street', {
                schema: { seed: { type: 'int', default: 7 } },

                init: function () {
                    const S = CONFIG.street, L = S.length, RW = S.roadWidth, SW = S.sidewalkWidth, CH = S.curbHeight;
                    const rnd = mulberry32(this.data.seed * 31 + 5);
                    const root = new THREE.Group();
                    const add = (geo, mat, x, y, z, o) => {
                        const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
                        if (o && o.ry) m.rotation.y = o.ry;
                        if (o && o.rx) m.rotation.x = o.rx;
                        m.castShadow = !!(o && o.cast); m.receiveShadow = !(o && o.noReceive);
                        root.add(m); return m;
                    };

                    /* ---------------- sky: a big gradient dome (ignores fog) ---------------- */
                    const skyTex = canvasTexture(4, 256, (g, w, h) => {
                        const gr = g.createLinearGradient(0, 0, 0, h);
                        gr.addColorStop(0, '#8ea2b2'); gr.addColorStop(0.42, '#c3c9c8'); gr.addColorStop(0.5, '#d8d0c0'); gr.addColorStop(1, '#cfc7b8');
                        g.fillStyle = gr; g.fillRect(0, 0, w, h);
                    });
                    skyTex.wrapT = THREE.ClampToEdgeWrapping;
                    const sky = new THREE.Mesh(new THREE.SphereGeometry(330, 20, 14), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false }));
                    sky.renderOrder = -10; root.add(sky);

                    /* ---------------- road, pavements, markings ---------------- */
                    const asphalt = canvasTexture(256, 256, (g, w, h) => {
                        g.fillStyle = '#3d3d40'; g.fillRect(0, 0, w, h);
                        for (let i = 0; i < 9000; i++) { const v = 40 + Math.floor(rnd() * 45); g.fillStyle = 'rgb(' + v + ',' + v + ',' + (v + 3) + ')'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); }
                        g.strokeStyle = 'rgba(15,15,17,.65)';
                        for (let i = 0; i < 6; i++) { g.beginPath(); let x = rnd() * w, y = rnd() * h; g.moveTo(x, y); for (let k = 0; k < 8; k++) { x += rr(rnd, -18, 18); y += rr(rnd, -18, 18); g.lineTo(x, y); } g.stroke(); }
                    }, RW / 4, L / 4);
                    add(new THREE.PlaneGeometry(RW, L + 40), std({ map: asphalt, roughness: 0.95 }), 0, 0, 0, { rx: -Math.PI / 2 });

                    const tiles = canvasTexture(256, 256, (g, w, h) => {
                        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
                            const v = 125 + Math.floor(rnd() * 22); g.fillStyle = 'rgb(' + v + ',' + (v - 3) + ',' + (v - 9) + ')'; g.fillRect(i * 64, j * 64, 64, 64);
                            g.strokeStyle = '#66625b'; g.lineWidth = 2; g.strokeRect(i * 64 + 1, j * 64 + 1, 62, 62);
                        }
                    }, SW / 1.6, (L + 40) / 1.6);
                    const concrete = std({ color: 0x9a968e, roughness: 1 });
                    const tactile = canvasTexture(64, 64, (g, w, h) => {      // the yellow guide strip along the kerb
                        g.fillStyle = '#d6b52c'; g.fillRect(0, 0, w, h); g.fillStyle = '#a98d1c';
                        for (let i = 0; i < 4; i++) g.fillRect(8 + i * 14, 0, 5, h);
                    }, 1, (L + 40) / 0.8);
                    [-1, 1].forEach((s) => {
                        const px = s * (RW / 2 + SW / 2);
                        add(new THREE.BoxGeometry(SW, CH, L + 40), [concrete, concrete, std({ map: tiles, roughness: 1 }), concrete, concrete, concrete], px, CH / 2, 0);
                        add(new THREE.BoxGeometry(0.22, CH + 0.03, L + 40), std({ color: 0xb4b0a6, roughness: 1 }), s * (RW / 2 + 0.11), (CH + 0.03) / 2, 0);   // kerb stone
                        add(new THREE.PlaneGeometry(0.45, L + 40), std({ map: tactile, roughness: 1 }), s * (RW / 2 + 0.7), CH + 0.004, 0, { rx: -Math.PI / 2 });
                    });
                    // paint: dashed centre line + zebra crossing as one InstancedMesh
                    const paintMat = std({ color: 0xe9e6dc, roughness: 0.9 });
                    const paint = [];
                    for (let z = -L / 2 - 10; z < L / 2 + 10; z += 4) paint.push([0, z, 0.14, 2.0]);
                    for (let i = 0; i < 12; i++) paint.push([-RW / 2 + 0.5 + i * (RW - 1) / 11, -8, 0.5, 3.2]);
                    const paintMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.01, 1), paintMat, paint.length);
                    paint.forEach((p, i) => { const m = new THREE.Matrix4().compose(new THREE.Vector3(p[0], 0.008, p[1]), new THREE.Quaternion(), new THREE.Vector3(p[2], 1, p[3])); paintMesh.setMatrixAt(i, m); });
                    paintMesh.receiveShadow = true; root.add(paintMesh);

                    /* ---------------- buildings (facades are canvas drawings) ---------------- */
                    const PX = 40;   // pixels per metre on facade textures
                    const brickTone = [[128, 124, 118], [118, 116, 112], [138, 128, 116]];
                    function drawBrick(g, W, H, tone) {
                        g.fillStyle = '#55534f'; g.fillRect(0, 0, W, H);
                        const bh = 5, bw = 14;
                        for (let y = 0, row = 0; y < H; y += bh, row++) {
                            const off = row % 2 ? bw / 2 : 0;
                            for (let x = -off; x < W; x += bw) {
                                const v = Math.floor(rr(rnd, -16, 16));
                                g.fillStyle = 'rgb(' + (tone[0] + v) + ',' + (tone[1] + v) + ',' + (tone[2] + v) + ')'; g.fillRect(x + 1, y + 1, bw - 2, bh - 1);
                            }
                        }
                    }
                    function grime(g, W, H) {
                        const gr = g.createLinearGradient(0, H * 0.7, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(20,18,15,.4)');
                        g.fillStyle = gr; g.fillRect(0, H * 0.7, W, H * 0.3);
                    }
                    function drawWindow(g, x, y, w, h) {
                        g.fillStyle = '#2f2924'; g.fillRect(x - 3, y - 3, w + 6, h + 6);
                        g.fillStyle = '#6d8796'; g.fillRect(x, y, w, h);
                        g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x, y, w * 0.45, h);
                        g.fillStyle = '#2f2924'; g.fillRect(x + w / 2 - 1, y, 2, h); g.fillRect(x, y + h / 2 - 1, w, 2);
                    }
                    const CJK = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Heiti SC",sans-serif';
                    const SHOPS = ['小吃', '面馆', '理发', '便利店', '烟酒', '五金', '旅馆', '修车', '包子', '杂货'];

                    // kind: 'gate' (hutong courtyard gate), 'shop', 'plain' (brick wall with windows)
                    function facade(kind, w, h) {
                        const W = Math.round(w * PX), H = Math.round(h * PX);
                        return canvasTexture(W, H, (g) => {
                            if (kind === 'gate') {
                                drawBrick(g, W, H, pick(rnd, brickTone));
                                g.fillStyle = 'rgba(30,28,25,.45)'; g.fillRect(0, H - 0.45 * PX, W, 0.45 * PX);           // dark plinth
                                const dw = 2.0 * PX, dh = 2.5 * PX, dx = W / 2 - dw / 2 + rr(rnd, -0.5, 0.5) * PX, dy = H - dh;
                                g.fillStyle = '#34302c'; g.fillRect(dx - 6, dy - 6, dw + 12, dh + 6);                     // door frame
                                g.fillStyle = '#8e1b15'; g.fillRect(dx, dy, dw, dh);                                      // red door
                                g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(dx + dw / 2 - 1, dy, 2, dh);                  // gap between the two leaves
                                g.fillStyle = '#c9a24a';                                                                  // brass studs
                                for (let leaf = 0; leaf < 2; leaf++) for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
                                    g.beginPath(); g.arc(dx + leaf * dw / 2 + 10 + i * ((dw / 2 - 20) / 3), dy + 14 + j * 14, 2.2, 0, TAU); g.fill();
                                }
                                g.fillStyle = '#3f4347'; g.fillRect(dx - 0.4 * PX, dy - 0.45 * PX, dw + 0.8 * PX, 0.35 * PX);   // little tiled eave over the door
                                g.fillStyle = 'rgba(255,255,255,.12)'; for (let i = 0; i < dw / 6; i++) g.fillRect(dx - 0.4 * PX + i * 6, dy - 0.45 * PX, 1, 0.35 * PX);
                                g.fillStyle = '#c4281c';                                                                  // two red lanterns
                                [dx - 0.25 * PX, dx + dw + 0.25 * PX].forEach((lx) => { g.beginPath(); g.ellipse(lx, dy - 0.05 * PX, 7, 10, 0, 0, TAU); g.fill(); g.fillStyle = '#e8c35a'; g.fillRect(lx - 1, dy + 5, 2, 8); g.fillStyle = '#c4281c'; });
                                g.fillStyle = '#e8e4da'; g.fillRect(dx + dw + 12, dy + 0.3 * PX, 0.3 * PX, 0.2 * PX);      // house-number plate
                                if (W > 7 * PX) { drawWindow(g, W * 0.12, H - 2.2 * PX, 1.0 * PX, 0.9 * PX); drawWindow(g, W * 0.88 - PX, H - 2.2 * PX, 1.0 * PX, 0.9 * PX); }
                            } else if (kind === 'shop') {
                                g.fillStyle = pick(rnd, ['#c9c1ae', '#cbbfa4', '#bfc3b6']); g.fillRect(0, 0, W, H);
                                for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(80,70,55,' + rr(rnd, 0.03, 0.09) + ')'; g.fillRect(rnd() * W, rnd() * H, rr(rnd, 6, 40), rr(rnd, 6, 30)); }
                                const ow = W * 0.72, oh = Math.min(2.5 * PX, H - 1.2 * PX), ox = (W - ow) / 2, oy = H - oh;
                                const gl = g.createLinearGradient(0, oy, 0, oy + oh); gl.addColorStop(0, '#f0e2b0'); gl.addColorStop(1, '#c9b27a');
                                g.fillStyle = '#2d2925'; g.fillRect(ox - 5, oy - 5, ow + 10, oh + 5); g.fillStyle = gl; g.fillRect(ox, oy, ow, oh);
                                for (let i = 0; i < 26; i++) { g.fillStyle = pick(rnd, ['#b8472c', '#2d6a4f', '#d8a31a', '#3f6fa5', '#eee']); g.fillRect(ox + 6 + rnd() * (ow - 30), oy + 8 + rnd() * (oh - 24), rr(rnd, 6, 20), rr(rnd, 8, 20)); }
                                const sh = Math.min(0.7 * PX, oy - 4), sy = oy - sh - 4, col = pick(rnd, ['#b3201a', '#e0b020', '#1c6b3c', '#1f4e8c']);
                                g.fillStyle = col; g.fillRect(ox - 0.2 * PX, sy, ow + 0.4 * PX, sh);
                                g.fillStyle = col === '#e0b020' ? '#2a2018' : '#f6efd9'; g.textAlign = 'center'; g.textBaseline = 'middle';
                                g.font = 'bold ' + Math.floor(sh * 0.7) + 'px ' + CJK; g.fillText(pick(rnd, SHOPS), ox + ow / 2, sy + sh / 2 + 1);
                            } else {
                                drawBrick(g, W, H, pick(rnd, brickTone));
                                const n = Math.max(2, Math.floor(w / 3.2));
                                for (let i = 0; i < n; i++) {
                                    const wx = (i + 0.5) * W / n - 0.55 * PX, wy = H - 2.4 * PX;
                                    drawWindow(g, wx, wy, 1.1 * PX, 1.0 * PX);
                                    if (rnd() < 0.4) { g.fillStyle = '#bfc2c4'; g.fillRect(wx + 1.2 * PX, wy + 0.3 * PX, 0.55 * PX, 0.4 * PX); }   // air-conditioner box
                                }
                            }
                            grime(g, W, H);
                        });
                    }

                    // Hutong-style pitched roof: a triangular prism with the ridge running along z.
                    function gableRoof(w, d, hgt, over) {
                        const D = d / 2 + over, Lz = w / 2 + over, H = hgt, V = [], T = [];
                        const tri = (a, b, c, ua, ub, uc) => { V.push(a, b, c); T.push(ua, ub, uc); };
                        const k = 1.1, sl = Math.hypot(D, H);
                        // left slope, right slope (each two triangles), then the two gable ends
                        tri([-D, 0, -Lz], [-D, 0, Lz], [0, H, Lz], [0, 0], [2 * Lz * k, 0], [2 * Lz * k, sl * k]);
                        tri([-D, 0, -Lz], [0, H, Lz], [0, H, -Lz], [0, 0], [2 * Lz * k, sl * k], [0, sl * k]);
                        tri([0, H, -Lz], [0, H, Lz], [D, 0, Lz], [0, sl * k], [2 * Lz * k, sl * k], [2 * Lz * k, 0]);
                        tri([0, H, -Lz], [D, 0, Lz], [D, 0, -Lz], [0, sl * k], [2 * Lz * k, 0], [0, 0]);
                        tri([-D, 0, Lz], [D, 0, Lz], [0, H, Lz], [0, 0], [1, 0], [0.5, 0.5]);
                        tri([D, 0, -Lz], [-D, 0, -Lz], [0, H, -Lz], [0, 0], [1, 0], [0.5, 0.5]);
                        const g = new THREE.BufferGeometry();
                        g.setAttribute('position', new THREE.Float32BufferAttribute(V.flat(), 3));
                        g.setAttribute('uv', new THREE.Float32BufferAttribute(T.flat(), 2));
                        g.computeVertexNormals();
                        return g;
                    }
                    const roofTex = canvasTexture(128, 128, (g, w, h) => {
                        g.fillStyle = '#464a50'; g.fillRect(0, 0, w, h);
                        for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 8) { const v = Math.floor(rr(rnd, -10, 10)); g.fillStyle = 'rgb(' + (74 + v) + ',' + (78 + v) + ',' + (84 + v) + ')'; g.fillRect(x + 1, y + 1, 6, 7); }
                    });
                    const roofMat = std({ map: roofTex, roughness: 0.9, side: THREE.DoubleSide });
                    const sideMat = std({ color: 0x8a867f, roughness: 1 });

                    // A tall concrete block texture (grid of windows) used for the skyline behind the low houses.
                    const blockTex = (base) => canvasTexture(128, 128, (g, w, h) => {
                        g.fillStyle = base; g.fillRect(0, 0, w, h);
                        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
                            g.fillStyle = rnd() < 0.15 ? '#e9d9a0' : '#58687a'; g.fillRect(i * 32 + 6, j * 32 + 7, 20, 18);
                            g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(i * 32 + 6, j * 32 + 24, 20, 2);
                        }
                    }, 1, 1);

                    [-1, 1].forEach((s) => {
                        // street-facing face: +x face for the left side (s=-1), -x face for the right side (s=+1)
                        const faceIdx = s > 0 ? 1 : 0;
                        let z = -L / 2 + rnd() * 3;
                        while (z < L / 2 - 8) {
                            const w = rr(rnd, 7, 13), depth = rr(rnd, 5, 8), h = rr(rnd, 3.6, 4.9);
                            const r = rnd(), kind = r < 0.42 ? 'gate' : (r < 0.7 ? 'shop' : 'plain');
                            const zc = z + w / 2, x = s * (RW / 2 + SW + depth / 2);
                            const mats = [sideMat, sideMat, sideMat, sideMat, sideMat, sideMat];
                            mats[faceIdx] = std({ map: facade(kind, w, h), roughness: 0.95 });
                            add(new THREE.BoxGeometry(depth, h, w), mats, x, h / 2, zc, { cast: true });
                            add(gableRoof(w, depth, rr(rnd, 1.1, 1.7), 0.5), roofMat, x, h, zc, { cast: true });
                            z += w + rr(rnd, 0.1, 1.2);
                        }
                        // continuous skyline wall behind, plus a few taller blocks poking up
                        const back = blockTex(pick(rnd, ['#cdbfa6', '#b9bbb5', '#d3c1b4']));
                        back.repeat.set((L + 60) / 8, 3);
                        add(new THREE.BoxGeometry(6, 16, L + 60), std({ map: back, roughness: 1 }), s * 30, 8, 0);
                        for (let i = 0; i < 4; i++) {
                            const bh = rr(rnd, 9, 18), bw = rr(rnd, 9, 15), bt = blockTex(pick(rnd, ['#cdbfa6', '#b9bbb5', '#d3c1b4', '#c4b7c0']));
                            bt.repeat.set(bw / 5, bh / 5);
                            add(new THREE.BoxGeometry(8, bh, bw), std({ map: bt, roughness: 1 }), s * 20, bh / 2, rr(rnd, -L / 2 + 10, L / 2 - 10), { cast: true });
                        }
                    });
                    // end caps so the street doesn't open onto nothing
                    [-1, 1].forEach((s) => {
                        const bt = blockTex('#c2b9a8'); bt.repeat.set(10, 4);
                        add(new THREE.BoxGeometry(70, 20, 8), std({ map: bt, roughness: 1 }), 0, 10, s * (L / 2 + 14));
                    });

                    /* ---------------- trees (ginkgo-gold and green), street lamps, signs ---------------- */
                    const trunkMat = std({ color: 0x5a4632, roughness: 1 });
                    const leafCols = [0xd6aa2f, 0xc8a63a, 0x7d9a3b, 0xb7792a, 0x8da843];
                    const blob = new THREE.IcosahedronGeometry(1, 1), trunkGeo = new THREE.CylinderGeometry(0.12, 0.17, 3.2, 7);
                    [-1, 1].forEach((s) => {
                        for (let z = -L / 2 + 6 + rnd() * 4; z < L / 2 - 4; z += rr(rnd, 9, 13)) {
                            const tx = s * (RW / 2 + SW - 0.8), tc = pick(rnd, leafCols);
                            add(trunkGeo, trunkMat, tx, CH + 1.6, z, { cast: true });
                            const leaf = std({ color: tc, roughness: 1, flatShading: true });
                            [[0, 3.7, 0, 1.7], [0.8, 3.2, 0.5, 1.2], [-0.7, 4.1, -0.4, 1.15], [0.1, 3.0, -0.9, 1.0]].forEach((b) => {
                                const m = add(blob, leaf, tx + b[0], CH + b[1], z + b[2], { cast: true }); m.scale.setScalar(b[3]);
                            });
                        }
                    });
                    const poleMat = std({ color: 0x3a3d40, roughness: 0.7, metalness: 0.3 });
                    const lampMat = std({ color: 0xf1ecd6, emissive: 0xf5e6a8, emissiveIntensity: 0.6, roughness: 0.5 });
                    [-1, 1].forEach((s) => {
                        for (let z = -L / 2 + 8; z < L / 2; z += 20) {
                            const px = s * (RW / 2 + 0.55);
                            add(new THREE.CylinderGeometry(0.06, 0.08, 6.2, 8), poleMat, px, CH + 3.1, z, { cast: true });
                            add(new THREE.BoxGeometry(1.4, 0.07, 0.07), poleMat, px - s * 0.6, CH + 6.15, z);
                            add(new THREE.BoxGeometry(0.5, 0.12, 0.22), lampMat, px - s * 1.25, CH + 6.08, z);
                        }
                    });
                    // the chair's own sign, as a road sign: blue disc, red ring and slash, 禁止停车
                    const signTex = canvasTexture(256, 320, (g, w, h) => {
                        g.fillStyle = '#f2f0ea'; g.fillRect(0, 0, w, h);
                        g.beginPath(); g.arc(128, 128, 112, 0, TAU); g.fillStyle = '#1b4f9b'; g.fill();
                        g.lineWidth = 16; g.strokeStyle = '#c8261d'; g.stroke();
                        g.beginPath(); g.moveTo(52, 204); g.lineTo(204, 52); g.stroke();
                        g.beginPath(); g.moveTo(52, 52); g.lineTo(204, 204); g.stroke();
                        g.fillStyle = '#1a1a1a'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 64px ' + CJK; g.fillText('禁止停车', 128, 275);
                    });
                    const signMat = std({ map: signTex, roughness: 0.6 });
                    [[-1, 30], [1, 2], [-1, -28], [1, -46]].forEach((a) => {
                        const sx = a[0] * (RW / 2 + 0.55);
                        add(new THREE.CylinderGeometry(0.035, 0.035, 2.5, 6), poleMat, sx, CH + 1.25, a[1], { cast: true });
                        add(new THREE.PlaneGeometry(0.55, 0.69), signMat, sx, CH + 2.25, a[1] + 0.045, { cast: true }).material.side = THREE.DoubleSide;
                    });

                    /* ---------------- hanging red lanterns across the street ---------------- */
                    const lanternGeo = new THREE.SphereGeometry(0.17, 12, 9); lanternGeo.scale(1, 1.3, 1);
                    const lanternMat = std({ color: 0xb3241a, emissive: 0x7a1208, emissiveIntensity: 0.8, roughness: 0.6 });
                    const strings = [];
                    for (let z = -L / 2 + 10; z < L / 2 - 6; z += 17) strings.push(z);
                    const lanterns = new THREE.InstancedMesh(lanternGeo, lanternMat, strings.length * 9);
                    const wireMat = new THREE.LineBasicMaterial({ color: 0x2a2a2a });
                    const xa = RW / 2 + SW - 0.1, ya = 3.1, droop = 0.7;
                    let li = 0;
                    strings.forEach((z) => {
                        const pts = [];
                        for (let i = 0; i <= 16; i++) { const t = i / 16, x = -xa + 2 * xa * t, y = ya - droop * 4 * t * (1 - t); pts.push(new THREE.Vector3(x, y, z)); }
                        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
                        for (let i = 0; i < 9; i++) {
                            const t = (i + 0.5) / 9, x = -xa + 2 * xa * t, y = ya - droop * 4 * t * (1 - t) - 0.3;
                            lanterns.setMatrixAt(li++, new THREE.Matrix4().makeTranslation(x, y, z));
                        }
                    });
                    lanterns.castShadow = false; root.add(lanterns);

                    this.el.setObject3D('street', root);
                }
            });

            /* ======================================================================
             * COMPONENT  street-lights
             * A hemisphere light (sky colour above, warm bounce from the ground) and a
             * low autumn sun that follows the player so the shadow map stays sharp.
             * Shadows are skipped on phones / VR headsets (too heavy).
             * ====================================================================== */
            AFRAME.registerComponent('street-lights', {
                schema: { shadows: { default: true } },
                init: function () {
                    const sceneEl = this.el.sceneEl, renderer = sceneEl.renderer;
                    // three.js >= r155 uses physical light units; scale so it looks the same either way
                    const k = (renderer && renderer.useLegacyLights === true) ? 1 : Math.PI;
                    const hemi = new THREE.HemisphereLight(0xdfe6ee, 0x8b8070, 0.95 * k);
                    const sun = new THREE.DirectionalLight(0xfff0d2, 1.25 * k);
                    sun.position.set(30, 45, 20);
                    const wantShadows = this.data.shadows && !AFRAME.utils.device.isMobile() && !AFRAME.utils.device.isMobileVR();
                    if (wantShadows && renderer) {
                        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                        sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
                        const c = sun.shadow.camera; c.left = -26; c.right = 26; c.top = 26; c.bottom = -26; c.near = 1; c.far = 140;
                        sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
                    }
                    this.sun = sun; this.rig = null;
                    this.el.object3D.add(hemi, sun, sun.target);
                },
                tick: function () {
                    if (!this.rig) this.rig = document.getElementById('rig');
                    if (!this.rig) return;
                    const p = this.rig.object3D.position;     // keep the shadow box centred on the player
                    this.sun.position.set(p.x + 30, 45, p.z + 20);
                    this.sun.target.position.set(p.x, 0, p.z);
                    this.sun.target.updateMatrixWorld();
                }
            });

            /* ======================================================================
             * COMPONENT  walker
             * Attach to the camera RIG (the parent of the camera). Moves the rig in the
             * direction the camera is looking, so it works with the mouse/phone look
             * controls AND in VR (where your head decides where "forward" is).
             *   keyboard: WASD / arrows, Shift = run
             *   touch   : the HUD arrow buttons write into this.pad
             *   VR      : left thumbstick walks, right thumbstick snap-turns 30 degrees
             * ====================================================================== */
            AFRAME.registerComponent('walker', {
                schema: {
                    speed: { default: 2.2 }, run: { default: 4.6 },
                    minX: { default: -6.8 }, maxX: { default: 6.8 }, minZ: { default: -56 }, maxZ: { default: 56 },
                    camera: { type: 'selector', default: '#cam' }
                },
                init: function () {
                    this.keys = {}; this.pad = { f: 0, s: 0 }; this.stick = { x: 0, y: 0 }; this.turned = false;
                    this.q = new THREE.Quaternion(); this.d = new THREE.Vector3();
                    this.onKey = (down) => (e) => { this.keys[e.code] = down; };
                    window.addEventListener('keydown', this.onKey(true));
                    window.addEventListener('keyup', this.onKey(false));
                    const lh = document.getElementById('lhand'), rh = document.getElementById('rhand');
                    if (lh) lh.addEventListener('thumbstickmoved', (e) => { this.stick.x = e.detail.x; this.stick.y = e.detail.y; });
                    if (rh) rh.addEventListener('thumbstickmoved', (e) => {
                        const x = e.detail.x;
                        if (Math.abs(x) > 0.7 && !this.turned) { this.el.object3D.rotation.y += (x > 0 ? -1 : 1) * Math.PI / 6; this.turned = true; }
                        else if (Math.abs(x) < 0.3) this.turned = false;
                    });
                },
                tick: function (t, dtMs) {
                    const k = this.keys, dt = Math.min(dtMs, 100) / 1000, dz = (v) => (Math.abs(v) < 0.15 ? 0 : v);
                    let f = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0) + this.pad.f - dz(this.stick.y);
                    let s = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0) + this.pad.s + dz(this.stick.x);
                    const len = Math.hypot(f, s);
                    if (len < 0.01) return;
                    if (len > 1) { f /= len; s /= len; }
                    // horizontal direction the camera is facing (-z in camera space)
                    const cam = this.data.camera ? this.data.camera.object3D : this.el.object3D;
                    cam.getWorldQuaternion(this.q);
                    this.d.set(0, 0, -1).applyQuaternion(this.q); this.d.y = 0;
                    if (this.d.lengthSq() < 1e-6) return;
                    this.d.normalize();
                    const v = (k.ShiftLeft || k.ShiftRight ? this.data.run : this.data.speed) * dt;
                    const p = this.el.object3D.position, D = this.data;
                    p.x = Math.max(D.minX, Math.min(D.maxX, p.x + (this.d.x * f - this.d.z * s) * v));
                    p.z = Math.max(D.minZ, Math.min(D.maxZ, p.z + (this.d.z * f + this.d.x * s) * v));
                }
            });

            /* ======================================================================
             * HUD: buttons, touch pad, chair counter (plain DOM, outside A-Frame)
             * ====================================================================== */
            window.addEventListener('DOMContentLoaded', function () {
                const scene = document.querySelector('a-scene'), rigEl = document.getElementById('rig');
                const info = document.getElementById('count');
                const field = () => document.getElementById('world').components['chair-field'];
                function update() { const f = field(); if (f && f.count !== undefined && info) info.textContent = f.count + ' chairs, shuffle #' + f.seed; }
                function reshuffle() {
                    const f = field(); if (!f || !f.scatter) return;
                    const seed = Math.floor(Math.random() * 100000);
                    f.scatter(seed); update();
                    try { history.replaceState(null, '', '?seed=' + seed); } catch (e) { }
                }
                function home() {
                    rigEl.object3D.position.set(CONFIG.start.x, 0, CONFIG.start.z); rigEl.object3D.rotation.y = 0;
                }
                document.getElementById('bShuffle').onclick = reshuffle;
                document.getElementById('bHome').onclick = home;
                window.addEventListener('keydown', (e) => { if (e.code === 'KeyR' && !e.repeat) reshuffle(); });
                scene.addEventListener('chairs-scattered', update);
                scene.addEventListener('loaded', update);

                // touch arrows -> walker.pad (only shown on touch screens, hidden in VR)
                const pad = document.getElementById('pad');
                if ('ontouchstart' in window || navigator.maxTouchPoints > 0) pad.style.display = 'grid';
                scene.addEventListener('enter-vr', () => { document.getElementById('hud').style.display = 'none'; });
                scene.addEventListener('exit-vr', () => { document.getElementById('hud').style.display = ''; });
                pad.querySelectorAll('button').forEach((b) => {
                    const dir = b.dataset.k, val = { f: ['f', 1], b: ['f', -1], l: ['s', -1], r: ['s', 1] }[dir];
                    const walker = () => rigEl.components.walker;
                    b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); walker().pad[val[0]] = val[1]; });
                    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => b.addEventListener(ev, () => { walker().pad[val[0]] = 0; }));
                });
            });
        })();
    </script>
</head>

<body>
    <!--
    The scene. Everything is switched on by attributes:
      fog       hazy Beijing air; its colour matches the horizon of the sky dome
      #world    one entity that carries the chairs, the street and the lights
      #rig      the "player": walker moves it; the camera (and VR hands) are its children
  -->
    <a-scene fog="type: linear; color: #d3cbbd; near: 24; far: 125" renderer="antialias: true"
        loading-screen="dotsColor: #d3cbbd; backgroundColor: #26231e">

        <a-entity id="world" beijing-street="seed: 7" chair-field street-lights></a-entity>

        <a-entity id="rig" position="0 0 36" walker="minX: -6.8; maxX: 6.8; minZ: -56; maxZ: 56">
            <a-camera id="cam" position="0 1.6 0" wasd-controls-enabled="false"
                look-controls="pointerLockEnabled: false"></a-camera>
            <!--<a-entity id="lhand" hand-controls="hand: left"></a-entity>
           <a-entity id="rhand" hand-controls="hand: right"></a-entity>-->
            <a-entity id="lhand" laser-controls="hand: left"></a-entity>
            <a-entity id="rhand" laser-controls="hand: right"></a-entity>
        </a-entity>
    </a-scene>

    <div id="hud">
        <div id="title"><b>Beijing Chair Street</b><span id="count"></span></div>
        <div id="hint">WASD / arrows walk, Shift runs, drag to look, R reshuffles the chairs. On a phone use the arrows.
            In VR: left stick walks, right stick turns.</div>
        <div id="bar"><button id="bShuffle">Reshuffle chairs</button><button id="bHome">Back to start</button></div>
        <div id="pad">
            <button class="u" data-k="f" aria-label="Walk forward">&#9650;</button>
            <button class="l" data-k="l" aria-label="Step left">&#9664;</button>
            <button class="d" data-k="b" aria-label="Walk back">&#9660;</button>
            <button class="r" data-k="r" aria-label="Step right">&#9654;</button>
        </div>
    </div>
</body>

</html>
